<!DOCTYPE html>
<html lang="en" class="bg-black">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Family Budget" />
  <meta id="theme-color-meta" name="theme-color" content="#000000" />
  <title>Family Budget & Multi-Year Engine</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM UMD -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 50px);
      --sab: env(safe-area-inset-bottom, 20px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    
    html, body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    input, select, button, textarea {
      font-family: inherit;
      user-select: auto;
      -webkit-user-select: auto;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* iOS Native Safe Area Inset Utility Classes */
    .ios-safe-header {
      padding-top: max(env(safe-area-inset-top), 48px);
      padding-left: max(env(safe-area-inset-left), 16px);
      padding-right: max(env(safe-area-inset-right), 16px);
    }

    .ios-safe-container {
      padding-left: max(env(safe-area-inset-left), 16px);
      padding-right: max(env(safe-area-inset-right), 16px);
    }

    .ios-safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 12px);
      padding-left: max(env(safe-area-inset-left), 12px);
      padding-right: max(env(safe-area-inset-right), 12px);
    }
  </style>
</head>
<body class="bg-black text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white transition-colors duration-300">
  <div id="root">
    <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center bg-[#000000] text-slate-100">
      <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Loading Family Budget...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Zero-dependency SVG Icon Component
    const Icon = ({ name, size = 18, className = "" }) => {
      const props = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: `inline-block ${className}`
      };

      switch (name) {
        case 'wallet': return <svg {...props}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0-0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V7"/><path d="M18 12h.01"/></svg>;
        case 'trending-up': return <svg {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        case 'trending-down': return <svg {...props}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>;
        case 'arrow-down-left': return <svg {...props}><line x1="17" y1="7" x2="7" y2="17"/><polyline points="17 17 7 17 7 7"/></svg>;
        case 'arrow-up-right': return <svg {...props}><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>;
        case 'plus': return <svg {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        case 'briefcase': return <svg {...props}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
        case 'piggy-bank': return <svg {...props}><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-3.5c1-.5 1.5-1 2.5-2 1.5-1.5 1.5-3.5 1.5-4.5 0-2.5-1.5-4-3-4z"/><circle cx="7" cy="11" r="1"/></svg>;
        case 'credit-card': return <svg {...props}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>;
        case 'layout-dashboard': return <svg {...props}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
        case 'receipt': return <svg {...props}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>;
        case 'coins': return <svg {...props}><circle cx="8" cy="8" r="6"/><path d="M18 8A6 6 0 0 1 6 18"/><path d="M7 6h1v4"/><path d="M17 12h1v4"/></svg>;
        case 'baby': return <svg {...props}><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/><path d="M12 13v3"/><path d="M10 18h4"/></svg>;
        case 'sparkles': return <svg {...props}><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>;
        case 'trash-2': return <svg {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        case 'edit-3': return <svg {...props}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        case 'check': return <svg {...props}><polyline points="20 6 9 17 4 12"/></svg>;
        case 'x': return <svg {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        case 'sun': return <svg {...props}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
        case 'moon': return <svg {...props}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
        default: return <svg {...props}><circle cx="12" cy="12" r="10"/></svg>;
      }
    };

    // Circular Progress Gauge
    const ProgressCircle = ({ percent = 0, size = 68, strokeWidth = 6, color = "stroke-emerald-500", label, isDark = true }) => {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (Math.min(100, Math.max(0, percent)) / 100) * circumference;

      return (
        <div className="relative flex flex-col items-center justify-center shrink-0" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="transform -rotate-90">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="currentColor" strokeWidth={strokeWidth} className={isDark ? "text-zinc-800" : "text-slate-200"} fill="transparent" />
            <circle
              cx={size / 2} cy={size / 2} r={radius} stroke="currentColor" strokeWidth={strokeWidth}
              className={`${color} transition-all duration-700 ease-out`}
              fill="transparent"
              strokeDasharray={circumference}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="round"
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className={`text-[11px] font-black tracking-tighter leading-none ${isDark ? 'text-slate-100' : 'text-slate-800'}`}>{Math.round(percent)}%</span>
            {label && <span className={`text-[8px] mt-0.5 font-semibold leading-none ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>{label}</span>}
          </div>
        </div>
      );
    };

    // Interactive 12-Month Yearly Trend Chart
    const MonthlyTrendChart = ({ data, selectedMonth, onSelectMonth, isDark = true }) => {
      const maxVal = useMemo(() => {
        return Math.max(...data.map(d => Math.max(d.income, d.expenses)), 1000);
      }, [data]);

      return (
        <div className="space-y-2">
          <div className={`flex items-center justify-center space-x-5 text-[10px] font-bold px-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
            <span className="flex items-center space-x-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span><span>Income</span></span>
            <span className="flex items-center space-x-1.5"><span className="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span><span>Outgoings</span></span>
          </div>

          <div className={`h-32 w-full flex items-end justify-between pt-3 pb-1 px-1 border-b ${isDark ? 'border-zinc-800' : 'border-slate-200'}`}>
            {data.map((d) => {
              const incHeight = Math.round((d.income / maxVal) * 95);
              const expHeight = Math.round((d.expenses / maxVal) * 95);
              const isSelected = selectedMonth === d.month;

              return (
                <button
                  key={d.month}
                  onClick={() => onSelectMonth(d.month)}
                  className={`flex flex-col items-center justify-end space-y-1 group active:scale-95 transition-all ${isSelected ? 'scale-105' : 'opacity-60 hover:opacity-100'}`}
                >
                  <div className="flex items-end space-x-0.5 h-24">
                    <div 
                      style={{ height: `${incHeight}px` }} 
                      className={`w-2.5 rounded-t-sm transition-all ${isSelected ? 'bg-emerald-500 shadow-md shadow-emerald-500/30' : 'bg-emerald-500/50'}`}
                    ></div>
                    <div 
                      style={{ height: `${expHeight}px` }} 
                      className={`w-2.5 rounded-t-sm transition-all ${isSelected ? 'bg-rose-500 shadow-md shadow-rose-500/30' : 'bg-rose-500/50'}`}
                    ></div>
                  </div>
                  <span className={`text-[9px] font-extrabold ${isSelected ? (isDark ? 'text-blue-400 font-black' : 'text-blue-600 font-black') : (isDark ? 'text-slate-400' : 'text-slate-500')}`}>
                    {d.month.substring(0, 3)}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      );
    };

    // Seed Data[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)
    const INITIAL_DEBTS = [
      { id: 'd1', recipient: 'Monteflor', total: 1500, balance: 1500, comments: '1st month rent/deposit' },
      { id: 'd2', recipient: 'Tita Norie', total: 604.52, balance: 604.52, comments: '700 EUR 1st month rent/deposit' },
      { id: 'd3', recipient: 'Clarence', total: 2400, balance: 800, comments: '800 remaining balance' }
    ];

    const INITIAL_SAVINGS_POTS = [
      { id: 'p1', name: 'Emergency Cash ISA 🏦', balance: 1892.70, target: 5000, icon: 'wallet' },
      { id: 'p2', name: 'Debt Repayment 💸', balance: 1538.20, target: 4504.52, icon: 'credit-card' },
      { id: 'p3', name: 'Holidays ✈️', balance: 100.00, target: 2000, icon: 'piggy-bank' },
      { id: 'p4', name: 'Gifts 🎁', balance: 237.38, target: 500, icon: 'piggy-bank' },
      { id: 'p5', name: 'Bonus Pot 🎯', balance: 27.55, target: 1000, icon: 'coins' }
    ];

    const MONTH_NAMES = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const DEFAULT_MONTHLY_ITEMS = [
      { id: 'e1', name: 'Rent', category: 'NEEDS', budget: 1299.00, actual: 1299.00, payer: 'All', dueDate: '1st', status: 'Paid' },
      { id: 'e2', name: 'Council Tax', category: 'NEEDS', budget: 123.00, actual: 123.00, payer: 'All', dueDate: '1st', status: 'Paid' },
      { id: 'e3', name: 'Thames Water', category: 'NEEDS', budget: 35.00, actual: 35.00, payer: 'May', dueDate: '1st', status: 'Paid' },
      { id: 'e4', name: 'TV License', category: 'NEEDS', budget: 14.00, actual: 14.00, payer: 'David', dueDate: '1st', status: 'Paid' },
      { id: 'e5', name: 'Car Insurance', category: 'NEEDS', budget: 61.50, actual: 61.50, payer: 'Both', dueDate: '1st', status: 'Paid' },
      { id: 'e6', name: 'Netflix', category: 'WANTS', budget: 7.00, actual: 7.00, payer: 'David', dueDate: '1st', status: 'Paid' },
      { id: 'e7', name: 'Third Space Gym', category: 'WANTS', budget: 20.00, actual: 20.00, payer: 'David', dueDate: '5th', status: 'Paid' },
      { id: 'e8', name: 'Google One', category: 'NEEDS', budget: 7.99, actual: 7.99, payer: 'David', dueDate: '5th', status: 'Paid' },
      { id: 'e9', name: 'Palwagan Savings', category: 'SAVINGS', budget: 200.00, actual: 200.00, payer: 'David', dueDate: '10th', status: 'Paid' },
      { id: 'e10', name: 'Virgin Media', category: 'NEEDS', budget: 56.00, actual: 56.00, payer: 'Daniel', dueDate: '12th', status: 'Paid' },
      { id: 'e11', name: 'Gas & Electricity', category: 'NEEDS', budget: 100.00, actual: 100.00, payer: 'David', dueDate: '15th', status: 'Paid' },
      { id: 'e12', name: 'Groceries & Household', category: 'NEEDS', budget: 300.00, actual: 300.00, payer: 'May', dueDate: 'Weekly', status: 'Paid' },
      { id: 'e13', name: 'Vodafone Mobile', category: 'NEEDS', budget: 74.00, actual: 74.00, payer: 'David', dueDate: '20th', status: 'Paid' },
      { id: 'e14', name: 'Amazon Prime', category: 'WANTS', budget: 7.99, actual: 7.99, payer: 'David', dueDate: '22nd', status: 'Paid' },
      { id: 'e15', name: 'Apple Subscriptions', category: 'WANTS', budget: 23.00, actual: 23.00, payer: 'David', dueDate: '27th', status: 'Paid' }
    ];

    const DEFAULT_INCOME_SOURCES = [
      { id: 'i1', name: "Base Salary", amount: 4924.99, recipient: 'David & May' },
      { id: 'i2', name: "Side Hustles", amount: 270.00, recipient: 'Side Income' }
    ];

    const App = () => {
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('fb_theme');
        return saved ? saved === 'dark' : true;
      });

      const [selectedYear, setSelectedYear] = useState(2026);
      const [selectedMonth, setSelectedMonth] = useState('January');
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [editModal, setEditModal] = useState(null);

      const [debts, setDebts] = useState(() => {
        const saved = localStorage.getItem('fb_debts');
        return saved ? JSON.parse(saved) : INITIAL_DEBTS;
      });

      const [pots, setPots] = useState(() => {
        const saved = localStorage.getItem('fb_pots');
        return saved ? JSON.parse(saved) : INITIAL_SAVINGS_POTS;
      });

      const [monthlyData, setMonthlyData] = useState(() => {
        const saved = localStorage.getItem('fb_monthly_data');
        if (saved) return JSON.parse(saved);
        
        const initial = {};
        [2024, 2025, 2026, 2027].forEach(yr => {
          initial[yr] = {};
          MONTH_NAMES.forEach(m => {
            initial[yr][m] = {
              incomes: [...DEFAULT_INCOME_SOURCES],
              expenses: [...DEFAULT_MONTHLY_ITEMS],
              extraIncome: [
                { id: 'x1', date: `${yr}-01-17`, description: 'Piano lessons', duration: '3h', price: 75, net: 75, status: 'Paid' },
                { id: 'x2', date: `${yr}-01-22`, description: 'Spanish lessons', duration: '3h', price: 45, net: 45, status: 'Paid' },
                { id: 'x3', date: `${yr}-01-30`, description: 'Babysitting / Nanny', duration: '8.5h', price: 150, net: 150, status: 'Paid' }
              ],
              kids: {
                benefitAJ: 104.20,
                benefitEC: 69.00,
                giftIn: 0,
                expenses: [
                  { id: 'ke1', name: 'School Supplies & Uniforms', category: 'Needs', amount: 45.50, child: 'AJ' },
                  { id: 'ke2', name: 'Learning Apps & Toys', category: 'Wants', amount: 20.00, child: 'EC' }
                ]
              }
            };
          });
        });
        return initial;
      });

      // Synchronize document body background and status bar meta color
      useEffect(() => {
        const themeBg = isDark ? '#000000' : '#f2f2f7';
        document.body.style.backgroundColor = themeBg;
        document.documentElement.style.backgroundColor = themeBg;
        
        const meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', themeBg);

        localStorage.setItem('fb_theme', isDark ? 'dark' : 'light');
      }, [isDark]);

      useEffect(() => { localStorage.setItem('fb_debts', JSON.stringify(debts)); }, [debts]);
      useEffect(() => { localStorage.setItem('fb_pots', JSON.stringify(pots)); }, [pots]);
      useEffect(() => { localStorage.setItem('fb_monthly_data', JSON.stringify(monthlyData)); }, [monthlyData]);

      const currentMonthObj = useMemo(() => {
        if (!monthlyData[selectedYear] || !monthlyData[selectedYear][selectedMonth]) {
          return { incomes: [], expenses: [], extraIncome: [], kids: { benefitAJ: 104.2, benefitEC: 69, giftIn: 0, expenses: [] } };
        }
        return monthlyData[selectedYear][selectedMonth];
      }, [monthlyData, selectedYear, selectedMonth]);

      // Calculations
      const baseIncome = useMemo(() => currentMonthObj.incomes.reduce((sum, item) => sum + Number(item.amount || 0), 0), [currentMonthObj.incomes]);
      const totalExtraIncome = useMemo(() => currentMonthObj.extraIncome.reduce((sum, item) => sum + Number(item.net || item.price || 0), 0), [currentMonthObj.extraIncome]);
      const totalIncome = baseIncome + totalExtraIncome;
      const totalExpenses = useMemo(() => currentMonthObj.expenses.reduce((sum, item) => sum + Number(item.actual || item.budget || 0), 0), [currentMonthObj.expenses]);
      const totalBudgetedExpenses = useMemo(() => currentMonthObj.expenses.reduce((sum, item) => sum + Number(item.budget || 0), 0), [currentMonthObj.expenses]);
      const netSavings = totalIncome - totalExpenses;

      const yearTrendData = useMemo(() => {
        return MONTH_NAMES.map(m => {
          const mObj = monthlyData[selectedYear]?.[m] || { incomes: [], expenses: [], extraIncome: [] };
          const inc = mObj.incomes.reduce((s, i) => s + Number(i.amount || 0), 0) + mObj.extraIncome.reduce((s, x) => s + Number(x.net || x.price || 0), 0);
          const exp = mObj.expenses.reduce((s, e) => s + Number(e.actual || e.budget || 0), 0);
          return { month: m, income: inc, expenses: exp };
        });
      }, [monthlyData, selectedYear]);

      const categoryTotals = useMemo(() => {
        const cats = { NEEDS: 0, WANTS: 0, SAVINGS: 0 };
        currentMonthObj.expenses.forEach(e => {
          const c = e.category ? e.category.toUpperCase() : 'NEEDS';
          cats[c] = (cats[c] || 0) + Number(e.actual || e.budget || 0);
        });
        return cats;
      }, [currentMonthObj.expenses]);

      const kidsSummary = useMemo(() => {
        const k = currentMonthObj.kids || { benefitAJ: 104.2, benefitEC: 69, giftIn: 0, expenses: [] };
        const totalBenefit = Number(k.benefitAJ || 0) + Number(k.benefitEC || 0) + Number(k.giftIn || 0);
        const totalKidsExpenses = (k.expenses || []).reduce((sum, e) => sum + Number(e.amount || 0), 0);
        
        return {
          totalBenefit,
          jISA: totalBenefit * 0.15,
          needs: totalBenefit * 0.30,
          childcare: totalBenefit * 0.10,
          futurePot: totalBenefit * 0.45,
          totalKidsExpenses
        };
      }, [currentMonthObj.kids]);

      // CRUD Handlers
      const toggleExpenseStatus = (id) => {
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          const list = updated[selectedYear][selectedMonth].expenses;
          const index = list.findIndex(e => e.id === id);
          if (index !== -1) {
            const current = list[index].status;
            list[index].status = current === 'Paid' ? 'Pending' : 'Paid';
          }
          return updated;
        });
      };

      const deleteExpense = (id) => {
        if (!confirm('Delete this bill?')) return;
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          updated[selectedYear][selectedMonth].expenses = updated[selectedYear][selectedMonth].expenses.filter(e => e.id !== id);
          return updated;
        });
      };

      const deleteExtraIncome = (id) => {
        if (!confirm('Delete this gig entry?')) return;
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          updated[selectedYear][selectedMonth].extraIncome = updated[selectedYear][selectedMonth].extraIncome.filter(x => x.id !== id);
          return updated;
        });
      };

      const handleSaveModal = (e) => {
        e.preventDefault();
        const { type, isNew, item } = editModal;

        if (type === 'expense') {
          setMonthlyData(prev => {
            const updated = JSON.parse(JSON.stringify(prev));
            const list = updated[selectedYear][selectedMonth].expenses;
            if (isNew) list.push(item);
            else {

                          <Icon name="edit-3" size={14} />
                        </button>
                      </div>

                  ))}
                </div>
              </div>

                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 6: DEBTS */}
            {activeTab === 'debts' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between min-w-0 gap-2">

                    className="px-3 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1 active:scale-95 transition-all shadow-md shadow-rose-500/20 shrink-0"
                  >
                    <Icon name="plus" size={14} />
                    <span>Add Debt</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 landscape:grid-cols-2 md:grid-cols-2 gap-3">
                  {debts.map(debt => (
                    <div key={debt.id} className={`p-4 border ${cardTheme} space-y-2 flex flex-col justify-between min-w-0`}>
                      <div className="flex items-center justify-between gap-2 min-w-0">
                        <div className="min-w-0 flex-1">
                          <span className={`text-xs font-bold truncate block ${isDark ? 'text-slate-100' : 'text-slate-800'}`}>{debt.recipient}</span>

                        <span className="truncate">Paid: £{(debt.total - debt.balance).toFixed(2)}</span>

                { id: 'extra', label: 'Extra', icon: 'coins' },
                { id: 'kids', label: 'Kids Hub', icon: 'baby' },
                { id: 'pots', label: 'Pots', icon: 'piggy-bank' },
                { id: 'debts', label: 'Debts', icon: 'credit-card' }

                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, duration: e.target.value}})}

                          />
                        </div>
                      </div>
                    </>
                  )}

                  {editModal.type === 'pot' && (
                    <>
                      <div>
                        <label className={`text-[10px] block mb-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Pot Name</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.name} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, name: e.target.value}})}
                          className={`w-full text-xs p-2.5 rounded-xl outline-none border ${isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-black'}`} 
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className={`text-[10px] block mb-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Balance (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.balance} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, balance: parseFloat(e.target.value) || 0}})}

                          />
                        </div>
                        <div>
                          <label className={`text-[10px] block mb-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Target (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.target} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, target: parseFloat(e.target.value) || 0}})}
                            className={`w-full text-xs p-2.5 rounded-xl outline-none border ${isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-black'}`} 
                          />
                        </div>
                      </div>
                    </>
                  )}

                  {editModal.type === 'debt' && (
                    <>
                      <div>
                        <label className={`text-[10px] block mb-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Creditor Name</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.recipient} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, recipient: e.target.value}})}

                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className={`text-[10px] block mb-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Total (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.total} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, total: parseFloat(e.target.value) || 0}})}
                            className={`w-full text-xs p-2.5 rounded-xl outline-none border ${isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-black'}`} 
                          />
                        </div>
                        <div>
                          <label className={`text-[10px] block mb-1 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Balance (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.balance} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, balance: parseFloat(e.target.value) || 0}})}
                            className={`w-full text-xs p-2.5 rounded-xl outline-none border ${isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-black'}`} 
                          />
                        </div>
                      </div>
                    </>
                  )}

                  <div className="pt-2 flex items-center space-x-2">
                    <button 
                      type="button" 
                      onClick={() => setEditModal(null)}
                      className={`w-1/2 py-2.5 rounded-xl text-xs font-bold active:scale-95 transition-all ${isDark ? 'bg-zinc-800 hover:bg-zinc-700 text-slate-300' : 'bg-slate-200 hover:bg-slate-300 text-slate-700'}`}
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="w-1/2 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold active:scale-95 transition-all shadow-md shadow-blue-500/20"
                    >
                      Save
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
