<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Family Budget" />
  <meta name="theme-color" content="#0f172a" />
  <title>Family Budget & Finance Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM UMD -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0f172a;
    }
    input, select, button, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
  <div id="root">
    <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
      <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-slate-400 text-sm font-medium">Loading Family Budget App...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SVG Icon Renderer Component ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const props = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: `inline-block ${className}`
      };

      switch (name) {
        case 'wallet':
          return <svg {...props}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0-0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V7"/><path d="M18 12h.01"/></svg>;
        case 'trending-up':
          return <svg {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        case 'trending-down':
          return <svg {...props}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>;
        case 'arrow-down-left':
          return <svg {...props}><line x1="17" y1="7" x2="7" y2="17"/><polyline points="17 17 7 17 7 7"/></svg>;
        case 'arrow-up-right':
          return <svg {...props}><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>;
        case 'plus':
          return <svg {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        case 'briefcase':
          return <svg {...props}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
        case 'piggy-bank':
          return <svg {...props}><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-3.5c1-.5 1.5-1 2.5-2 1.5-1.5 1.5-3.5 1.5-4.5 0-2.5-1.5-4-3-4z"/><circle cx="7" cy="11" r="1"/></svg>;
        case 'credit-card':
          return <svg {...props}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>;
        case 'layout-dashboard':
          return <svg {...props}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
        case 'receipt':
          return <svg {...props}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>;
        case 'coins':
          return <svg {...props}><circle cx="8" cy="8" r="6"/><path d="M18 8A6 6 0 0 1 6 18"/><path d="M7 6h1v4"/><path d="M17 12h1v4"/></svg>;
        case 'trash-2':
          return <svg {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        case 'edit-3':
          return <svg {...props}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        case 'x':
          return <svg {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        case 'check':
          return <svg {...props}><polyline points="20 6 9 17 4 12"/></svg>;
        default:
          return <svg {...props}><circle cx="12" cy="12" r="10"/></svg>;
      }
    };

    // Default Seed Data
    const INITIAL_DEBTS = [
      { id: 'd1', recipient: 'Monteflor', total: 1500, balance: 1500, comments: '1st month rent/deposit' },
      { id: 'd2', recipient: 'Tita Norie', total: 604.52, balance: 604.52, comments: '700 EUR 1st month rent/deposit' },
      { id: 'd3', recipient: 'Clarence', total: 2400, balance: 800, comments: '800 remaining balance' }
    ];

    const INITIAL_SAVINGS_POTS = [
      { id: 'p1', name: 'Emergency Cash ISA 🏦', balance: 1892.70, target: 5000, icon: 'wallet' },
      { id: 'p2', name: 'Debt Repayment 💸', balance: 1538.20, target: 4504.52, icon: 'credit-card' },
      { id: 'p3', name: 'Holidays ✈️', balance: 100.00, target: 2000, icon: 'piggy-bank' },
      { id: 'p4', name: 'Gifts 🎁', balance: 237.38, target: 500, icon: 'piggy-bank' },
      { id: 'p5', name: 'Bonus Pot 🎯', balance: 27.55, target: 1000, icon: 'coins' }
    ];

    const MONTH_NAMES = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const DEFAULT_MONTHLY_ITEMS = [
      { id: 'e1', name: 'Rent', category: 'NEEDS', budget: 1299.00, actual: 1299.00, payer: 'All', dueDate: '1st', status: 'Paid' },
      { id: 'e2', name: 'Council Tax', category: 'NEEDS', budget: 123.00, actual: 123.00, payer: 'All', dueDate: '1st', status: 'Paid' },
      { id: 'e3', name: 'Thames Water', category: 'NEEDS', budget: 35.00, actual: 35.00, payer: 'May', dueDate: '1st', status: 'Paid' },
      { id: 'e4', name: 'TV License', category: 'NEEDS', budget: 14.00, actual: 14.00, payer: 'David', dueDate: '1st', status: 'Paid' },
      { id: 'e5', name: 'Car Insurance', category: 'NEEDS', budget: 61.50, actual: 61.50, payer: 'Both', dueDate: '1st', status: 'Paid' },
      { id: 'e6', name: 'Netflix', category: 'WANTS', budget: 7.00, actual: 7.00, payer: 'David', dueDate: '1st', status: 'Paid' },
      { id: 'e7', name: 'Third Space Gym', category: 'WANTS', budget: 20.00, actual: 20.00, payer: 'David', dueDate: '5th', status: 'Paid' },
      { id: 'e8', name: 'Google One Storage', category: 'NEEDS', budget: 7.99, actual: 7.99, payer: 'David', dueDate: '5th', status: 'Paid' },
      { id: 'e9', name: 'Palwagan Savings', category: 'SAVINGS', budget: 200.00, actual: 200.00, payer: 'David', dueDate: '10th', status: 'Paid' },
      { id: 'e10', name: 'Virgin Media Broadband', category: 'NEEDS', budget: 56.00, actual: 56.00, payer: 'Daniel', dueDate: '12th', status: 'Paid' },
      { id: 'e11', name: 'Gas & Electricity', category: 'NEEDS', budget: 100.00, actual: 100.00, payer: 'David', dueDate: '15th', status: 'Paid' },
      { id: 'e12', name: 'Groceries & Household', category: 'NEEDS', budget: 300.00, actual: 300.00, payer: 'May', dueDate: 'Weekly', status: 'Paid' },
      { id: 'e13', name: 'Vodafone Mobile', category: 'NEEDS', budget: 74.00, actual: 74.00, payer: 'David', dueDate: '20th', status: 'Paid' },
      { id: 'e14', name: 'Amazon Prime', category: 'WANTS', budget: 7.99, actual: 7.99, payer: 'David', dueDate: '22nd', status: 'Paid' },
      { id: 'e15', name: 'Apple Subscriptions', category: 'WANTS', budget: 23.00, actual: 23.00, payer: 'David', dueDate: '27th', status: 'Paid' }
    ];

    const DEFAULT_INCOME_SOURCES = [
      { id: 'i1', name: "David Salary / Base Income", amount: 2310.35, recipient: 'David' },
      { id: 'i2', name: "May Salary / Main Income", amount: 2441.44, recipient: 'May' },
      { id: 'i3', name: "Child Benefit - AJ & EC", amount: 173.20, recipient: 'Children' }
    ];

    const App = () => {
      const [selectedYear, setSelectedYear] = useState(2026);
      const [selectedMonth, setSelectedMonth] = useState('January');
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // Edit Modal State
      const [editModal, setEditModal] = useState(null); // { type: 'expense'|'extra'|'pot'|'debt', item: {...} }

      const [debts, setDebts] = useState(() => {
        const saved = localStorage.getItem('fb_debts');
        return saved ? JSON.parse(saved) : INITIAL_DEBTS;
      });

      const [pots, setPots] = useState(() => {
        const saved = localStorage.getItem('fb_pots');
        return saved ? JSON.parse(saved) : INITIAL_SAVINGS_POTS;
      });

      const [monthlyData, setMonthlyData] = useState(() => {
        const saved = localStorage.getItem('fb_monthly_data');
        if (saved) return JSON.parse(saved);
        
        const initial = {};
        [2024, 2025, 2026, 2027].forEach(yr => {
          initial[yr] = {};
          MONTH_NAMES.forEach(m => {
            initial[yr][m] = {
              incomes: [...DEFAULT_INCOME_SOURCES],
              expenses: [...DEFAULT_MONTHLY_ITEMS],
              extraIncome: [
                { id: 'x1', date: `${yr}-01-17`, description: 'Piano lessons', duration: '3h', price: 75, status: 'Paid', net: 75 },
                { id: 'x2', date: `${yr}-01-22`, description: 'Spanish lessons', duration: '3h', price: 45, status: 'Paid', net: 45 },
                { id: 'x3', date: `${yr}-01-30`, description: 'Babysitting / Nanny', duration: '8.5h', price: 150, status: 'Paid', net: 150 }
              ]
            };
          });
        });
        return initial;
      });

      useEffect(() => {
        localStorage.setItem('fb_debts', JSON.stringify(debts));
      }, [debts]);

      useEffect(() => {
        localStorage.setItem('fb_pots', JSON.stringify(pots));
      }, [pots]);

      useEffect(() => {
        localStorage.setItem('fb_monthly_data', JSON.stringify(monthlyData));
      }, [monthlyData]);

      const currentMonthObj = useMemo(() => {
        if (!monthlyData[selectedYear] || !monthlyData[selectedYear][selectedMonth]) {
          return { incomes: [], expenses: [], extraIncome: [] };
        }
        return monthlyData[selectedYear][selectedMonth];
      }, [monthlyData, selectedYear, selectedMonth]);

      const totalIncome = useMemo(() => {
        return currentMonthObj.incomes.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      }, [currentMonthObj.incomes]);

      const totalExtraIncome = useMemo(() => {
        return currentMonthObj.extraIncome.reduce((sum, item) => sum + Number(item.net || item.price || 0), 0);
      }, [currentMonthObj.extraIncome]);

      const totalExpenses = useMemo(() => {
        return currentMonthObj.expenses.reduce((sum, item) => sum + Number(item.actual || item.budget || 0), 0);
      }, [currentMonthObj.expenses]);

      const netSavings = useMemo(() => {
        return (totalIncome + totalExtraIncome) - totalExpenses;
      }, [totalIncome, totalExtraIncome, totalExpenses]);

      // --- EXPENSE CRUD ---
      const toggleExpenseStatus = (id) => {
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          const list = updated[selectedYear][selectedMonth].expenses;
          const index = list.findIndex(e => e.id === id);
          if (index !== -1) {
            const current = list[index].status;
            list[index].status = current === 'Paid' ? 'Pending' : current === 'Pending' ? 'Scheduled' : 'Paid';
          }
          return updated;
        });
      };

      const addExpenseItem = () => {
        setEditModal({
          type: 'expense',
          isNew: true,
          item: { id: 'e_' + Date.now(), name: '', category: 'NEEDS', budget: 50, actual: 50, payer: 'Both', dueDate: '1st', status: 'Pending' }
        });
      };

      const deleteExpense = (id) => {
        if (!confirm('Are you sure you want to delete this expense?')) return;
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          updated[selectedYear][selectedMonth].expenses = updated[selectedYear][selectedMonth].expenses.filter(e => e.id !== id);
          return updated;
        });
      };

      // --- EXTRA INCOME CRUD ---
      const addExtraIncomeItem = () => {
        setEditModal({
          type: 'extra',
          isNew: true,
          item: { id: 'x_' + Date.now(), date: new Date().toISOString().split('T')[0], description: '', duration: '1h', price: 50, net: 50, status: 'Paid' }
        });
      };

      const deleteExtraIncome = (id) => {
        if (!confirm('Are you sure you want to delete this income entry?')) return;
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          updated[selectedYear][selectedMonth].extraIncome = updated[selectedYear][selectedMonth].extraIncome.filter(x => x.id !== id);
          return updated;
        });
      };

      // --- POTS CRUD ---
      const addPotItem = () => {
        setEditModal({
          type: 'pot',
          isNew: true,
          item: { id: 'p_' + Date.now(), name: '', balance: 0, target: 1000, icon: 'piggy-bank' }
        });
      };

      const deletePot = (id) => {
        if (!confirm('Are you sure you want to delete this savings pot?')) return;
        setPots(prev => prev.filter(p => p.id !== id));
      };

      // --- DEBTS CRUD ---
      const addDebtItem = () => {
        setEditModal({
          type: 'debt',
          isNew: true,
          item: { id: 'd_' + Date.now(), recipient: '', total: 500, balance: 500, comments: '' }
        });
      };

      const deleteDebt = (id) => {
        if (!confirm('Are you sure you want to delete this debt tracker?')) return;
        setDebts(prev => prev.filter(d => d.id !== id));
      };

      // --- SAVE MODAL CHANGES ---
      const handleSaveModal = (e) => {
        e.preventDefault();
        const { type, isNew, item } = editModal;

        if (type === 'expense') {
          setMonthlyData(prev => {
            const updated = JSON.parse(JSON.stringify(prev));
            const list = updated[selectedYear][selectedMonth].expenses;
            if (isNew) {
              list.push(item);
            } else {
              const idx = list.findIndex(e => e.id === item.id);
              if (idx !== -1) list[idx] = item;
            }
            return updated;
          });
        } else if (type === 'extra') {
          setMonthlyData(prev => {
            const updated = JSON.parse(JSON.stringify(prev));
            const list = updated[selectedYear][selectedMonth].extraIncome;
            if (isNew) {
              list.push(item);
            } else {
              const idx = list.findIndex(x => x.id === item.id);
              if (idx !== -1) list[idx] = item;
            }
            return updated;
          });
        } else if (type === 'pot') {
          setPots(prev => {
            if (isNew) return [...prev, item];
            return prev.map(p => p.id === item.id ? item : p);
          });
        } else if (type === 'debt') {
          setDebts(prev => {
            if (isNew) return [...prev, item];
            return prev.map(d => d.id === item.id ? item : d);
          });
        }

        setEditModal(null);
      };

      return (
        <div class="flex flex-col min-h-screen max-w-md mx-auto bg-slate-900 border-x border-slate-800 shadow-2xl pb-24">
          
          {/* Top Sticky Header */}
          <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 p-4">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center space-x-2">
                <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl">
                  <Icon name="wallet" size={22} />
                </div>
                <div>
                  <h1 class="text-base font-bold leading-tight">Family Budget</h1>
                  <p class="text-xs text-slate-400">Finance Tracker</p>
                </div>
              </div>
              
              <select 
                value={selectedYear} 
                onChange={(e) => setSelectedYear(Number(e.target.value))}
                class="bg-slate-800 text-xs font-bold text-indigo-400 px-3 py-1.5 rounded-lg border border-slate-700 outline-none"
              >
                <option value={2024}>2024</option>
                <option value={2025}>2025</option>
                <option value={2026}>2026</option>
                <option value={2027}>2027</option>
              </select>
            </div>

            <div class="flex space-x-1.5 overflow-x-auto no-scrollbar py-1">
              {MONTH_NAMES.map(m => (
                <button
                  key={m}
                  onClick={() => setSelectedMonth(m)}
                  class={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                    selectedMonth === m 
                      ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' 
                      : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                  }`}
                >
                  {m.substring(0, 3)}
                </button>
              ))}
            </div>
          </header>

          {/* Main Content */}
          <main class="flex-1 p-4 space-y-4">

            {/* Dashboard Tab */}
            {activeTab === 'dashboard' && (
              <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                  <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/60">
                    <div class="flex items-center space-x-1.5 text-xs text-slate-400 mb-1">
                      <Icon name="arrow-down-left" size={14} class="text-emerald-400" />
                      <span>Total Income</span>
                    </div>
                    <p class="text-lg font-extrabold text-emerald-400">£{(totalIncome + totalExtraIncome).toFixed(2)}</p>
                    <p class="text-[10px] text-slate-500 mt-0.5">Base + Extra Income</p>
                  </div>

                  <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/60">
                    <div class="flex items-center space-x-1.5 text-xs text-slate-400 mb-1">
                      <Icon name="arrow-up-right" size={14} class="text-rose-400" />
                      <span>Total Expenses</span>
                    </div>
                    <p class="text-lg font-extrabold text-rose-400">£{totalExpenses.toFixed(2)}</p>
                    <p class="text-[10px] text-slate-500 mt-0.5">Monthly Outgoings</p>
                  </div>
                </div>

                <div class={`p-4 rounded-2xl border flex items-center justify-between ${
                  netSavings >= 0 
                    ? 'bg-emerald-950/40 border-emerald-800/50 text-emerald-300' 
                    : 'bg-rose-950/40 border-rose-800/50 text-rose-300'
                }`}>
                  <div>
                    <span class="text-xs font-semibold uppercase tracking-wider block opacity-80">
                      {selectedMonth} {selectedYear} Cash Flow
                    </span>
                    <span class="text-2xl font-black">
                      {netSavings >= 0 ? '+' : ''}£{netSavings.toFixed(2)}
                    </span>
                  </div>
                  <div class={`p-3 rounded-xl ${netSavings >= 0 ? 'bg-emerald-500/20' : 'bg-rose-500/20'}`}>
                    <Icon name={netSavings >= 0 ? 'trending-up' : 'trending-down'} size={24} />
                  </div>
                </div>

                <div class="bg-slate-800/60 rounded-2xl border border-slate-800 p-4">
                  <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">
                      Bills Preview ({selectedMonth})
                    </h3>
                    <button onClick={() => setActiveTab('budget')} class="text-xs text-indigo-400 font-medium hover:underline">
                      View All
                    </button>
                  </div>

                  <div class="space-y-2">
                    {currentMonthObj.expenses.slice(0, 5).map(item => (
                      <div key={item.id} class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800/90 border border-slate-700/50">
                        <div class="flex items-center space-x-3">
                          <button 
                            onClick={() => toggleExpenseStatus(item.id)}
                            class={`w-5 h-5 rounded-md flex items-center justify-center text-xs ${
                              item.status === 'Paid' ? 'bg-emerald-500 text-slate-900 font-bold' : 'bg-slate-700 text-transparent'
                            }`}
                          >
                            ✓
                          </button>
                          <div>
                            <p class="text-xs font-bold text-slate-200">{item.name}</p>
                            <p class="text-[10px] text-slate-400">Due {item.dueDate} • {item.payer}</p>
                          </div>
                        </div>
                        <span class="text-xs font-bold text-slate-100">£{Number(item.actual || item.budget).toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Monthly Budget Tab */}
            {activeTab === 'budget' && (
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <h2 class="text-sm font-bold text-slate-200">Monthly Expenses & Bills</h2>
                  <button 
                    onClick={addExpenseItem}
                    class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1"
                  >
                    <Icon name="plus" size={14} />
                    <span>Add Expense</span>
                  </button>
                </div>

                <div class="space-y-2">
                  {currentMonthObj.expenses.map(item => (
                    <div key={item.id} class="p-3 bg-slate-800/80 rounded-2xl border border-slate-700/60 flex items-center justify-between">
                      <div class="flex items-center space-x-3">
                        <button 
                          onClick={() => toggleExpenseStatus(item.id)}
                          class={`px-2 py-1 rounded-lg text-[10px] font-bold tracking-wide uppercase transition-all ${
                            item.status === 'Paid' 
                              ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                              : item.status === 'Scheduled' 
                              ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                              : 'bg-slate-700 text-slate-400 border border-slate-600'
                          }`}
                        >
                          {item.status}
                        </button>
                        <div>
                          <p class="text-xs font-bold text-slate-100">{item.name}</p>
                          <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700/60 text-slate-300 font-medium">
                            Payer: {item.payer}
                          </span>
                        </div>
                      </div>

                      <div class="flex items-center space-x-2">
                        <div class="text-right">
                          <p class="text-xs font-extrabold text-slate-100">£{Number(item.actual || item.budget).toFixed(2)}</p>
                          <p class="text-[10px] text-slate-400">Due {item.dueDate}</p>
                        </div>
                        <button 
                          onClick={() => setEditModal({ type: 'expense', isNew: false, item: { ...item } })}
                          class="p-1.5 text-slate-400 hover:text-indigo-400 bg-slate-700/40 rounded-lg"
                        >
                          <Icon name="edit-3" size={14} />
                        </button>
                        <button 
                          onClick={() => deleteExpense(item.id)}
                          class="p-1.5 text-slate-400 hover:text-rose-400 bg-slate-700/40 rounded-lg"
                        >
                          <Icon name="trash-2" size={14} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Extra Income Tab */}
            {activeTab === 'extra' && (
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <div>
                    <h2 class="text-sm font-bold text-slate-200">Side Hustles & Extra Income</h2>
                    <p class="text-xs text-slate-400">Piano, Spanish, Babysitting & Gigs</p>
                  </div>
                  <button 
                    onClick={addExtraIncomeItem}
                    class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1"
                  >
                    <Icon name="plus" size={14} />
                    <span>Log Gig</span>
                  </button>
                </div>

                <div class="p-3 bg-emerald-950/30 border border-emerald-800/40 rounded-2xl flex items-center justify-between">
                  <span class="text-xs font-bold text-emerald-300">{selectedMonth} Side Income</span>
                  <span class="text-lg font-black text-emerald-400">£{totalExtraIncome.toFixed(2)}</span>
                </div>

                <div class="space-y-2">
                  {currentMonthObj.extraIncome.map(item => (
                    <div key={item.id} class="p-3 bg-slate-800/80 rounded-2xl border border-slate-700/60 flex items-center justify-between">
                      <div class="flex items-center space-x-3">
                        <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl">
                          <Icon name="briefcase" size={16} />
                        </div>
                        <div>
                          <p class="text-xs font-bold text-slate-100">{item.description}</p>
                          <p class="text-[10px] text-slate-400">{item.date} • {item.duration || 'Session'}</p>
                        </div>
                      </div>

                      <div class="flex items-center space-x-2">
                        <span class="text-xs font-extrabold text-emerald-400">+£{Number(item.net || item.price).toFixed(2)}</span>
                        <button 
                          onClick={() => setEditModal({ type: 'extra', isNew: false, item: { ...item } })}
                          class="p-1.5 text-slate-400 hover:text-indigo-400 bg-slate-700/40 rounded-lg"
                        >
                          <Icon name="edit-3" size={14} />
                        </button>
                        <button 
                          onClick={() => deleteExtraIncome(item.id)}
                          class="p-1.5 text-slate-400 hover:text-rose-400 bg-slate-700/40 rounded-lg"
                        >
                          <Icon name="trash-2" size={14} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Pots Tab */}
            {activeTab === 'pots' && (
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <h2 class="text-sm font-bold text-slate-200">Savings & Emergency Pots</h2>
                  <button 
                    onClick={addPotItem}
                    class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1"
                  >
                    <Icon name="plus" size={14} />
                    <span>New Pot</span>
                  </button>
                </div>

                <div class="space-y-2.5">
                  {pots.map(pot => {
                    const percent = Math.min(100, Math.round((pot.balance / pot.target) * 100));
                    return (
                      <div key={pot.id} class="p-3.5 bg-slate-800/80 rounded-2xl border border-slate-700/60 space-y-2">
                        <div class="flex items-center justify-between">
                          <div class="flex items-center space-x-2">
                            <div class="p-1.5 bg-indigo-500/20 text-indigo-400 rounded-lg">
                              <Icon name={pot.icon || 'piggy-bank'} size={16} />
                            </div>
                            <span class="text-xs font-bold text-slate-100">{pot.name}</span>
                          </div>
                          
                          <div class="flex items-center space-x-2">
                            <span class="text-xs font-black text-indigo-400">£{pot.balance.toFixed(2)}</span>
                            <button 
                              onClick={() => setEditModal({ type: 'pot', isNew: false, item: { ...pot } })}
                              class="p-1 text-slate-400 hover:text-indigo-400"
                            >
                              <Icon name="edit-3" size={14} />
                            </button>
                            <button 
                              onClick={() => deletePot(pot.id)}
                              class="p-1 text-slate-400 hover:text-rose-400"
                            >
                              <Icon name="trash-2" size={14} />
                            </button>
                          </div>
                        </div>

                        <div class="w-full bg-slate-700/60 rounded-full h-2 overflow-hidden">
                          <div 
                            class="bg-indigo-500 h-full rounded-full transition-all duration-500" 
                            style={{ width: `${percent}%` }}
                          ></div>
                        </div>

                        <div class="flex justify-between text-[10px] text-slate-400 font-medium">
                          <span>Target: £{pot.target}</span>
                          <span>{percent}% Reached</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Debts Tab */}
            {activeTab === 'debts' && (
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <h2 class="text-sm font-bold text-slate-200">Repayments & Debt Trackers</h2>
                  <button 
                    onClick={addDebtItem}
                    class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1"
                  >
                    <Icon name="plus" size={14} />
                    <span>Add Debt</span>
                  </button>
                </div>

                <div class="space-y-2.5">
                  {debts.map(debt => (
                    <div key={debt.id} class="p-3.5 bg-slate-800/80 rounded-2xl border border-slate-700/60 space-y-1.5">
                      <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-100">{debt.recipient}</span>
                        <div class="flex items-center space-x-2">
                          <span class="text-xs font-black text-rose-400">£{debt.balance.toFixed(2)} Left</span>
                          <button 
                            onClick={() => setEditModal({ type: 'debt', isNew: false, item: { ...debt } })}
                            class="p-1 text-slate-400 hover:text-indigo-400"
                          >
                            <Icon name="edit-3" size={14} />
                          </button>
                          <button 
                            onClick={() => deleteDebt(debt.id)}
                            class="p-1 text-slate-400 hover:text-rose-400"
                          >
                            <Icon name="trash-2" size={14} />
                          </button>
                        </div>
                      </div>
                      <p class="text-[11px] text-slate-400">{debt.comments}</p>
                      <div class="flex justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-700/40">
                        <span>Total: £{debt.total}</span>
                        <span>Paid: £{(debt.total - debt.balance).toFixed(2)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Navigation Bar */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 p-2 z-40">
            <div class="grid grid-cols-5 gap-1 text-center">
              {[
                { id: 'dashboard', label: 'Overview', icon: 'layout-dashboard' },
                { id: 'budget', label: 'Budget', icon: 'receipt' },
                { id: 'extra', label: 'Extra', icon: 'coins' },
                { id: 'pots', label: 'Pots', icon: 'piggy-bank' },
                { id: 'debts', label: 'Debts', icon: 'credit-card' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  class={`flex flex-col items-center justify-center py-1.5 rounded-xl transition-all ${
                    activeTab === tab.id 
                      ? 'text-indigo-400 font-bold bg-indigo-500/10' 
                      : 'text-slate-400 font-medium hover:text-slate-200'
                  }`}
                >
                  <Icon name={tab.icon} size={18} />
                  <span class="text-[10px] mt-1">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>

          {/* Universal Edit / Create Modal */}
          {editModal && (
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
                <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 class="text-sm font-bold text-slate-100 uppercase tracking-wider">
                    {editModal.isNew ? 'Add' : 'Edit'} {editModal.type.toUpperCase()}
                  </h3>
                  <button onClick={() => setEditModal(null)} class="text-slate-400 hover:text-white">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <form onSubmit={handleSaveModal} class="space-y-3">
                  
                  {/* Expense Form */}
                  {editModal.type === 'expense' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Name</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.name} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, name: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Amount (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.actual} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, actual: parseFloat(e.target.value) || 0, budget: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Payer</label>
                          <input 
                            type="text" 
                            value={editModal.item.payer} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, payer: e.target.value}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Due Date</label>
                        <input 
                          type="text" 
                          value={editModal.item.dueDate} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, dueDate: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                    </>
                  )}

                  {/* Extra Income Form */}
                  {editModal.type === 'extra' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Description</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.description} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, description: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Amount Net (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.net} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, net: parseFloat(e.target.value) || 0, price: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Duration</label>
                          <input 
                            type="text" 
                            value={editModal.item.duration} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, duration: e.target.value}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                    </>
                  )}

                  {/* Pot Form */}
                  {editModal.type === 'pot' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Pot Name</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.name} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, name: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Current Balance (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.balance} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, balance: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Target (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.target} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, target: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                    </>
                  )}

                  {/* Debt Form */}
                  {editModal.type === 'debt' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Recipient / Debt Name</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.recipient} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, recipient: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Total Amount (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.total} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, total: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Remaining Balance (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.balance} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, balance: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Comments / Terms</label>
                        <input 
                          type="text" 
                          value={editModal.item.comments} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, comments: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                    </>
                  )}

                  <div class="pt-2 flex items-center space-x-2">
                    <button 
                      type="button" 
                      onClick={() => setEditModal(null)}
                      class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-bold"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
