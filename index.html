<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Family Budget" />
  <meta name="theme-color" content="#0f172a" />
  <title>Family Budget & Finance Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM UMD (Cloudflare CDN) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0b0f19;
    }
    input, select, button, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-glow {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root">
    <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
      <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-slate-400 text-sm font-medium">Loading Family Budget App...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Inline SVG Icon Renderer Component ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const props = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: `inline-block ${className}`
      };

      switch (name) {
        case 'wallet': return <svg {...props}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0-0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V7"/><path d="M18 12h.01"/></svg>;
        case 'trending-up': return <svg {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        case 'trending-down': return <svg {...props}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>;
        case 'arrow-down-left': return <svg {...props}><line x1="17" y1="7" x2="7" y2="17"/><polyline points="17 17 7 17 7 7"/></svg>;
        case 'arrow-up-right': return <svg {...props}><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>;
        case 'plus': return <svg {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        case 'briefcase': return <svg {...props}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
        case 'piggy-bank': return <svg {...props}><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-3.5c1-.5 1.5-1 2.5-2 1.5-1.5 1.5-3.5 1.5-4.5 0-2.5-1.5-4-3-4z"/><circle cx="7" cy="11" r="1"/></svg>;
        case 'credit-card': return <svg {...props}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>;
        case 'layout-dashboard': return <svg {...props}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
        case 'receipt': return <svg {...props}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>;
        case 'coins': return <svg {...props}><circle cx="8" cy="8" r="6"/><path d="M18 8A6 6 0 0 1 6 18"/><path d="M7 6h1v4"/><path d="M17 12h1v4"/></svg>;
        case 'baby': return <svg {...props}><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/><path d="M12 13v3"/><path d="M10 18h4"/></svg>;
        case 'sparkles': return <svg {...props}><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>;
        case 'pie-chart': return <svg {...props}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
        case 'trash-2': return <svg {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        case 'edit-3': return <svg {...props}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        case 'x': return <svg {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        case 'check': return <svg {...props}><polyline points="20 6 9 17 4 12"/></svg>;
        default: return <svg {...props}><circle cx="12" cy="12" r="10"/></svg>;
      }
    };

    // --- Circular Progress Gauge Component ---
    const ProgressCircle = ({ percent = 0, size = 64, strokeWidth = 6, color = "stroke-indigo-500", label }) => {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (Math.min(100, Math.max(0, percent)) / 100) * circumference;

      return (
        <div class="relative flex flex-col items-center justify-center" style={{ width: size, height: size }}>
          <svg width={size} height={size} class="transform -rotate-90">
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke="currentColor"
              strokeWidth={strokeWidth}
              className="text-slate-800"
              fill="transparent"
            />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke="currentColor"
              strokeWidth={strokeWidth}
              className={`${color} transition-all duration-700 ease-out`}
              fill="transparent"
              strokeDasharray={circumference}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="round"
            />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span class="text-[11px] font-black tracking-tighter text-slate-100">{Math.round(percent)}%</span>
            {label && <span class="text-[8px] text-slate-400 -mt-1 font-semibold">{label}</span>}
          </div>
        </div>
      );
    };

    // --- Seed Data from Spreadsheet & Notebooks ---
    const INITIAL_DEBTS = [
      { id: 'd1', recipient: 'Monteflor', total: 1500, balance: 1500, comments: '1st month rent/deposit' },
      { id: 'd2', recipient: 'Tita Norie', total: 604.52, balance: 604.52, comments: '700 EUR 1st month rent/deposit' },
      { id: 'd3', recipient: 'Clarence', total: 2400, balance: 800, comments: '800 remaining balance' }
    ];

    const INITIAL_SAVINGS_POTS = [
      { id: 'p1', name: 'Emergency Cash ISA 🏦', balance: 1892.70, target: 5000, icon: 'wallet' },
      { id: 'p2', name: 'Debt Repayment 💸', balance: 1538.20, target: 4504.52, icon: 'credit-card' },
      { id: 'p3', name: 'Holidays ✈️', balance: 100.00, target: 2000, icon: 'piggy-bank' },
      { id: 'p4', name: 'Gifts 🎁', balance: 237.38, target: 500, icon: 'piggy-bank' },
      { id: 'p5', name: 'Bonus Pot 🎯', balance: 27.55, target: 1000, icon: 'coins' }
    ];

    const MONTH_NAMES = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const DEFAULT_MONTHLY_ITEMS = [
      { id: 'e1', name: 'Rent', category: 'NEEDS', budget: 1299.00, actual: 1299.00, payer: 'All', dueDate: '1st', status: 'Paid' },
      { id: 'e2', name: 'Council Tax', category: 'NEEDS', budget: 123.00, actual: 123.00, payer: 'All', dueDate: '1st', status: 'Paid' },
      { id: 'e3', name: 'Thames Water', category: 'NEEDS', budget: 35.00, actual: 35.00, payer: 'May', dueDate: '1st', status: 'Paid' },
      { id: 'e4', name: 'TV License', category: 'NEEDS', budget: 14.00, actual: 14.00, payer: 'David', dueDate: '1st', status: 'Paid' },
      { id: 'e5', name: 'Car Insurance', category: 'NEEDS', budget: 61.50, actual: 61.50, payer: 'Both', dueDate: '1st', status: 'Paid' },
      { id: 'e6', name: 'Netflix', category: 'WANTS', budget: 7.00, actual: 7.00, payer: 'David', dueDate: '1st', status: 'Paid' },
      { id: 'e7', name: 'Third Space Gym', category: 'WANTS', budget: 20.00, actual: 20.00, payer: 'David', dueDate: '5th', status: 'Paid' },
      { id: 'e8', name: 'Google One Storage', category: 'NEEDS', budget: 7.99, actual: 7.99, payer: 'David', dueDate: '5th', status: 'Paid' },
      { id: 'e9', name: 'Palwagan Savings', category: 'SAVINGS', budget: 200.00, actual: 200.00, payer: 'David', dueDate: '10th', status: 'Paid' },
      { id: 'e10', name: 'Virgin Media Broadband', category: 'NEEDS', budget: 56.00, actual: 56.00, payer: 'Daniel', dueDate: '12th', status: 'Paid' },
      { id: 'e11', name: 'Gas & Electricity', category: 'NEEDS', budget: 100.00, actual: 100.00, payer: 'David', dueDate: '15th', status: 'Paid' },
      { id: 'e12', name: 'Groceries & Household', category: 'NEEDS', budget: 300.00, actual: 300.00, payer: 'May', dueDate: 'Weekly', status: 'Paid' },
      { id: 'e13', name: 'Vodafone Mobile', category: 'NEEDS', budget: 74.00, actual: 74.00, payer: 'David', dueDate: '20th', status: 'Paid' },
      { id: 'e14', name: 'Amazon Prime', category: 'WANTS', budget: 7.99, actual: 7.99, payer: 'David', dueDate: '22nd', status: 'Paid' },
      { id: 'e15', name: 'Apple Subscriptions', category: 'WANTS', budget: 23.00, actual: 23.00, payer: 'David', dueDate: '27th', status: 'Paid' }
    ];

    const DEFAULT_INCOME_SOURCES = [
      { id: 'i1', name: "David Salary / Base Income", amount: 2310.35, recipient: 'David' },
      { id: 'i2', name: "May Salary / Main Income", amount: 2441.44, recipient: 'May' },
      { id: 'i3', name: "Child Benefit - AJ & EC", amount: 173.20, recipient: 'Children' }
    ];

    const App = () => {
      const [selectedYear, setSelectedYear] = useState(2026);
      const [selectedMonth, setSelectedMonth] = useState('January');
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'budget', 'extra', 'kids', 'pots', 'debts'
      
      const [editModal, setEditModal] = useState(null); // { type: 'expense'|'extra'|'pot'|'debt'|'kidExpense', isNew: bool, item: {} }

      const [debts, setDebts] = useState(() => {
        const saved = localStorage.getItem('fb_debts');
        return saved ? JSON.parse(saved) : INITIAL_DEBTS;
      });

      const [pots, setPots] = useState(() => {
        const saved = localStorage.getItem('fb_pots');
        return saved ? JSON.parse(saved) : INITIAL_SAVINGS_POTS;
      });

      const [monthlyData, setMonthlyData] = useState(() => {
        const saved = localStorage.getItem('fb_monthly_data');
        if (saved) return JSON.parse(saved);
        
        const initial = {};
        [2024, 2025, 2026, 2027].forEach(yr => {
          initial[yr] = {};
          MONTH_NAMES.forEach(m => {
            initial[yr][m] = {
              incomes: [...DEFAULT_INCOME_SOURCES],
              expenses: [...DEFAULT_MONTHLY_ITEMS],
              extraIncome: [
                { id: 'x1', date: `${yr}-01-17`, description: 'Piano lessons', duration: '3h', price: 75, status: 'Paid', net: 75 },
                { id: 'x2', date: `${yr}-01-22`, description: 'Spanish lessons', duration: '3h', price: 45, status: 'Paid', net: 45 },
                { id: 'x3', date: `${yr}-01-30`, description: 'Babysitting / Nanny', duration: '8.5h', price: 150, status: 'Paid', net: 150 }
              ],
              kids: {
                benefitAJ: 104.20,
                benefitEC: 69.00,
                giftIn: 0,
                expenses: [
                  { id: 'ke1', name: 'School Supplies & Uniforms', category: 'Needs', amount: 45.50, child: 'AJ' },
                  { id: 'ke2', name: 'Learning Apps & Toys', category: 'Wants', amount: 20.00, child: 'EC' }
                ]
              }
            };
          });
        });
        return initial;
      });

      useEffect(() => {
        localStorage.setItem('fb_debts', JSON.stringify(debts));
      }, [debts]);

      useEffect(() => {
        localStorage.setItem('fb_pots', JSON.stringify(pots));
      }, [pots]);

      useEffect(() => {
        localStorage.setItem('fb_monthly_data', JSON.stringify(monthlyData));
      }, [monthlyData]);

      const currentMonthObj = useMemo(() => {
        if (!monthlyData[selectedYear] || !monthlyData[selectedYear][selectedMonth]) {
          return { incomes: [], expenses: [], extraIncome: [], kids: { benefitAJ: 104.2, benefitEC: 69, giftIn: 0, expenses: [] } };
        }
        return monthlyData[selectedYear][selectedMonth];
      }, [monthlyData, selectedYear, selectedMonth]);

      // Calculation Summaries
      const totalIncome = useMemo(() => {
        return currentMonthObj.incomes.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      }, [currentMonthObj.incomes]);

      const totalExtraIncome = useMemo(() => {
        return currentMonthObj.extraIncome.reduce((sum, item) => sum + Number(item.net || item.price || 0), 0);
      }, [currentMonthObj.extraIncome]);

      const totalExpenses = useMemo(() => {
        return currentMonthObj.expenses.reduce((sum, item) => sum + Number(item.actual || item.budget || 0), 0);
      }, [currentMonthObj.expenses]);

      const netSavings = useMemo(() => {
        return (totalIncome + totalExtraIncome) - totalExpenses;
      }, [totalIncome, totalExtraIncome, totalExpenses]);

      // Category Allocations
      const categoryTotals = useMemo(() => {
        const cats = { NEEDS: 0, WANTS: 0, SAVINGS: 0 };
        currentMonthObj.expenses.forEach(e => {
          const c = e.category ? e.category.toUpperCase() : 'NEEDS';
          cats[c] = (cats[c] || 0) + Number(e.actual || e.budget || 0);
        });
        return cats;
      }, [currentMonthObj.expenses]);

      // Children Benefit Allocations (15% Junior ISA, 30% Needs, 10% Childcare, 45% Future Pot)
      const kidsSummary = useMemo(() => {
        const k = currentMonthObj.kids || { benefitAJ: 104.2, benefitEC: 69, giftIn: 0, expenses: [] };
        const totalBenefit = Number(k.benefitAJ || 0) + Number(k.benefitEC || 0) + Number(k.giftIn || 0);
        const totalKidsExpenses = (k.expenses || []).reduce((sum, e) => sum + Number(e.amount || 0), 0);
        
        return {
          totalBenefit,
          jISA: totalBenefit * 0.15,
          needs: totalBenefit * 0.30,
          childcare: totalBenefit * 0.10,
          futurePot: totalBenefit * 0.45,
          totalKidsExpenses,
          surplus: totalBenefit - totalKidsExpenses
        };
      }, [currentMonthObj.kids]);

      // Actions & Handlers
      const toggleExpenseStatus = (id) => {
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          const list = updated[selectedYear][selectedMonth].expenses;
          const index = list.findIndex(e => e.id === id);
          if (index !== -1) {
            const current = list[index].status;
            list[index].status = current === 'Paid' ? 'Pending' : current === 'Pending' ? 'Scheduled' : 'Paid';
          }
          return updated;
        });
      };

      const deleteExpense = (id) => {
        if (!confirm('Are you sure you want to delete this expense?')) return;
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          updated[selectedYear][selectedMonth].expenses = updated[selectedYear][selectedMonth].expenses.filter(e => e.id !== id);
          return updated;
        });
      };

      const deleteExtraIncome = (id) => {
        if (!confirm('Are you sure you want to delete this side hustle entry?')) return;
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          updated[selectedYear][selectedMonth].extraIncome = updated[selectedYear][selectedMonth].extraIncome.filter(x => x.id !== id);
          return updated;
        });
      };

      const deleteKidExpense = (id) => {
        if (!confirm('Are you sure you want to delete this child expense?')) return;
        setMonthlyData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          updated[selectedYear][selectedMonth].kids.expenses = updated[selectedYear][selectedMonth].kids.expenses.filter(k => k.id !== id);
          return updated;
        });
      };

      const handleSaveModal = (e) => {
        e.preventDefault();
        const { type, isNew, item } = editModal;

        if (type === 'expense') {
          setMonthlyData(prev => {
            const updated = JSON.parse(JSON.stringify(prev));
            const list = updated[selectedYear][selectedMonth].expenses;
            if (isNew) list.push(item);
            else {
              const idx = list.findIndex(e => e.id === item.id);
              if (idx !== -1) list[idx] = item;
            }
            return updated;
          });
        } else if (type === 'extra') {
          setMonthlyData(prev => {
            const updated = JSON.parse(JSON.stringify(prev));
            const list = updated[selectedYear][selectedMonth].extraIncome;
            if (isNew) list.push(item);
            else {
              const idx = list.findIndex(x => x.id === item.id);
              if (idx !== -1) list[idx] = item;
            }
            return updated;
          });
        } else if (type === 'kidExpense') {
          setMonthlyData(prev => {
            const updated = JSON.parse(JSON.stringify(prev));
            const list = updated[selectedYear][selectedMonth].kids.expenses;
            if (isNew) list.push(item);
            else {
              const idx = list.findIndex(k => k.id === item.id);
              if (idx !== -1) list[idx] = item;
            }
            return updated;
          });
        } else if (type === 'pot') {
          setPots(prev => isNew ? [...prev, item] : prev.map(p => p.id === item.id ? item : p));
        } else if (type === 'debt') {
          setDebts(prev => isNew ? [...prev, item] : prev.map(d => d.id === item.id ? item : d));
        }

        setEditModal(null);
      };

      return (
        <div class="flex flex-col min-h-screen max-w-md mx-auto bg-slate-950 border-x border-slate-900 shadow-2xl pb-24">
          
          {/* Top Header */}
          <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-xl border-b border-slate-800/80 p-4">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center space-x-2.5">
                <div class="p-2.5 bg-gradient-to-tr from-indigo-600 to-violet-500 text-white rounded-2xl shadow-lg shadow-indigo-500/20">
                  <Icon name="wallet" size={20} />
                </div>
                <div>
                  <h1 class="text-base font-black tracking-tight text-white leading-tight">Family Budget</h1>
                  <p class="text-[10px] text-indigo-400 font-semibold tracking-wide uppercase">Interactive Multi-Year Engine</p>
                </div>
              </div>
              
              <select 
                value={selectedYear} 
                onChange={(e) => setSelectedYear(Number(e.target.value))}
                class="bg-slate-900 text-xs font-bold text-indigo-400 px-3 py-2 rounded-xl border border-indigo-500/30 outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner"
              >
                <option value={2024}>2024</option>
                <option value={2025}>2025</option>
                <option value={2026}>2026</option>
                <option value={2027}>2027</option>
              </select>
            </div>

            {/* Horizontal Month Bar */}
            <div class="flex space-x-1.5 overflow-x-auto no-scrollbar py-1">
              {MONTH_NAMES.map(m => (
                <button
                  key={m}
                  onClick={() => setSelectedMonth(m)}
                  class={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all duration-200 ${
                    selectedMonth === m 
                      ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md shadow-indigo-600/30 scale-105' 
                      : 'bg-slate-900/90 text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-slate-800'
                  }`}
                >
                  {m.substring(0, 3)}
                </button>
              ))}
            </div>
          </header>

          {/* Main Display Body */}
          <main class="flex-1 p-4 space-y-4">

            {/* TAB 1: OVERVIEW & RICH DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div class="space-y-4">
                
                {/* Main Cash Flow Banner */}
                <div class={`p-4 rounded-3xl border glass-card-glow flex items-center justify-between relative overflow-hidden ${
                  netSavings >= 0 ? 'border-emerald-500/30' : 'border-rose-500/30'
                }`}>
                  <div class="relative z-10">
                    <span class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest block mb-0.5">
                      {selectedMonth} {selectedYear} Cash Flow
                    </span>
                    <p class={`text-3xl font-black tracking-tight ${netSavings >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {netSavings >= 0 ? '+' : ''}£{netSavings.toFixed(2)}
                    </p>

                  <button onClick={() => setEditModal(null)} class="text-slate-400 hover:text-white">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <form onSubmit={handleSaveModal} class="space-y-3">
                  
                  {/* Expense Form */}
                  {editModal.type === 'expense' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Expense Name</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.name} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, name: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Amount (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.actual} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, actual: parseFloat(e.target.value) || 0, budget: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Payer</label>
                          <input 
                            type="text" 
                            value={editModal.item.payer} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, payer: e.target.value}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Category</label>
                          <select 
                            value={editModal.item.category} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, category: e.target.value}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none"
                          >
                            <option value="NEEDS">NEEDS</option>
                            <option value="WANTS">WANTS</option>
                            <option value="SAVINGS">SAVINGS</option>
                          </select>
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Due Date</label>
                          <input 
                            type="text" 
                            value={editModal.item.dueDate} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, dueDate: e.target.value}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                    </>
                  )}

                  {/* Extra Income Form */}
                  {editModal.type === 'extra' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Description</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.description} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, description: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Amount Net (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.net} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, net: parseFloat(e.target.value) || 0, price: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Duration</label>
                          <input 
                            type="text" 
                            value={editModal.item.duration} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, duration: e.target.value}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                    </>
                  )}

                  {/* Kid Expense Form */}
                  {editModal.type === 'kidExpense' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Item Description</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.name} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, name: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Amount (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.amount} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, amount: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Child</label>
                          <select 
                            value={editModal.item.child} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, child: e.target.value}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none"
                          >
                            <option value="AJ">AJ</option>
                            <option value="EC">EC</option>
                            <option value="Both">Both</option>
                          </select>
                        </div>
                      </div>
                    </>
                  )}

                  {/* Pot Form */}
                  {editModal.type === 'pot' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Pot Name</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.name} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, name: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Current Balance (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.balance} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, balance: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Target (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.target} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, target: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                    </>
                  )}

                  {/* Debt Form */}
                  {editModal.type === 'debt' && (
                    <>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Debt / Creditor Name</label>
                        <input 
                          type="text" 
                          required
                          value={editModal.item.recipient} 
                          onChange={(e) => setEditModal({...editModal, item: {...editModal.item, recipient: e.target.value}})}
                          class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                        />
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Total Amount (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.total} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, total: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-slate-400 block mb-1">Balance Remaining (£)</label>
                          <input 
                            type="number" 
                            step="0.01"
                            required
                            value={editModal.item.balance} 
                            onChange={(e) => setEditModal({...editModal, item: {...editModal.item, balance: parseFloat(e.target.value) || 0}})}
                            class="w-full bg-slate-800 border border-slate-700 text-xs text-white p-2.5 rounded-xl outline-none focus:border-indigo-500" 
                          />
                        </div>
                      </div>
                    </>
                  )}

                  <div class="pt-2 flex items-center space-x-2">
                    <button 
                      type="button" 
                      onClick={() => setEditModal(null)}
                      class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      class="w-1/2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
